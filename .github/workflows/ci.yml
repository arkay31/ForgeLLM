name: ForgeLLM CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Python Syntax Check
        run: |
          python -m compileall backend/app

      - name: Run PyTest Test Suite (48 Test Cases)
        env:
          PYTHONPATH: backend
          INFERENCE_MODE: demo
          TRAINING_MODE: demo
          ENVIRONMENT: testing
          FORGE_API_KEY: forge-secret-key-2026-prod
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Build & Type Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm ci --prefix frontend

      - name: Build Frontend Production Bundle
        run: |
          npm run build --prefix frontend

  docker-build:
    name: Docker Image Reproducibility Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t forgellm-backend:latest .

      - name: Build Frontend Docker Image
        run: |
          docker build -t forgellm-frontend:latest ./frontend
