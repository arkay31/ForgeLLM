# ForgeLLM QLoRA Fine-Tuning Configuration File
model:
  base_model_name: "google/gemma-2b-it"
  fallback_model_name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  torch_dtype: "bfloat16"
  device_map: "auto"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  output_dir: "storage/checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  gradient_checkpointing: true
  max_seq_length: 2048

dataset:
  train_file: "storage/datasets/processed/spider/train.jsonl"
  val_file: "storage/datasets/processed/spider/val.jsonl"
  test_file: "storage/datasets/processed/spider/test.jsonl"
